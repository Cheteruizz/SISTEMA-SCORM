
    <div class="main-container">
        
        <div class="icon-header">
        </div>

        <h1>Metadatos del Paquete</h1>
        <p class="subtitle">Define la información descriptiva de tu paquete SCORM.</p>
        
        <h3 class="section-title">Información básica del curso</h3>

        <form class="metadata-form">
            
            <div class="form-row horizontal">
                <label for="titulo">Título del curso:</label>
                <input type="text" id="titulo" value="Matemáticas 1" class="input-box">
            </div>

            <div class="form-row horizontal">
                <label for="descripcion">Descripción del<br>curso:</label>
                <textarea id="descripcion" class="input-box area"></textarea>
            </div>

            <div class="form-row columns">
                
                <div class="col-group">
                    <label for="idioma">Idioma:</label>
                    <div class="select-wrapper">
                        <select id="idioma" class="select-box">
                            <option value="en">Inglés</option>
                            <option value="es">Español</option>
                        </select>
                        <svg class="arrow-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
                    </div>
                </div>

                <div class="col-group">
                    <label for="version">Versión del curso:</label>
                    <div class="select-wrapper">
                        <select id="version" class="select-box">
                            <option value="1.2">1.2</option>
                            <option value="2004">2004</option>
                        </select>
                        <svg class="arrow-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
                    </div>
                </div>

            </div>

        </form>

    </div>
