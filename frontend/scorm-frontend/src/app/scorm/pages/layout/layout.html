<div class="page-shell">
  <app-scorm-nav></app-scorm-nav>

  <div class="layout-shell">
    <div class="panel-hero">
      <img src="logoSCORM.png" alt="Logotipo de Manifestum" class="logo-img">
      <span class="hero-badge">Manifestum</span>
      <h1>Panel principal</h1>
      <p>Gestiona tus paquetes SCORM de forma sencilla y profesional.</p>
    </div>

    <div class="panel-grid">
      <div class="panel-card">
        <h3>Crear paquete</h3>
        <span>Inicia un proyecto SCORM desde cero.</span>
        <button class="btn-primary" (click)="crearPaquete()">Crear nuevo paquete</button>
      </div>

      <div class="panel-card">
        <h3>Historial</h3>
        <span>Retoma paquetes creados o en desarrollo.</span>
        <button class="btn-ghost" (click)="historial()">Historial y borradores</button>
      </div>

      <div class="panel-card">
        <h3>Importar ZIP</h3>
        <span>Sube un paquete SCORM y edítalo como uno nuevo.</span>
        <button class="btn-outline" (click)="seleccionarZip()">Importar paquete</button>
        <input #zipInput type="file" accept=".zip" class="sr-only" (change)="onZipSelected($event)">
      </div>

    </div>
  </div>
</div>
