<div class="contenedor-recursos">
  <div class="header-nav">
    <button class="btn-volver-atras" (click)="volver()">
      <span class="flecha-azul">&#8592;</span> Volver
    </button>
  </div>

  <div class="contenido-central">
    <div class="cabecera">
      <img src="logoSCORM.png" alt="Logo SCORM" class="icono-principal">
      <h1 class="titulo-principal">Recursos del Curso</h1>
      <p class="descripcion">
        Sube aqu&#237; los archivos multimedia y materiales educativos que usar&#225;n tus lecciones.
        Puedes a&#241;adir tantos recursos como desees.
      </p>
    </div>

    <form [formGroup]="recursosForm" class="formulario-recursos">
      <h3 class="subtitulo-archivo">Archivo:</h3>

      <div class="grid-inputs">
        <div class="grupo-input">
          <label>Nombre del Archivo:</label>
          <input type="text" formControlName="nombreArchivo" class="input-borde-azul">
        </div>

        <div class="grupo-input">
          <label>ID del Archivo:</label>
          <input type="text" formControlName="idArchivo" class="input-borde-azul" placeholder="Se genera automatico" [disabled]="true">
        </div>

        <div class="grupo-input">
          <label>ID Lecci&#243;n:</label>
          <select formControlName="idLeccion" class="input-borde-azul">
            <option value="">Selecciona una lecci&#243;n</option>
            <option *ngFor="let lec of lecciones" [value]="lec.id_leccion">
              {{ lec.label }}
            </option>
          </select>
        </div>

        <div class="grupo-input">
          <label>Tipo de Archivo:</label>
          <input type="file" formControlName="tipoArchivo" class="input-borde-azul"
                 (change)="onFileSelected($event)"
                 accept=".html,.js,.css,.json,.png,.jpg,.jpeg,.svg,.gif,.mp4,.webm,.mp3,.wav,.pdf">
        </div>

        <div class="texto-ayuda-container">
          <p class="texto-ayuda">
            Este sistema permite adjuntar HTML, JS, CSS, JSON, imagenes, audio, video y PDF.
          </p>
        </div>
      </div>
    </form>
  </div>

  <div class="acciones-inferiores">
    <button class="btn-accion" (click)="eliminarArchivo()">Eliminar Archivo</button>
    <button class="btn-accion" (click)="subirArchivo()">Subir Archivo</button>
    <button class="btn-accion" (click)="irAEditorSco()">Editor SCO</button>
    <button class="btn-accion" (click)="irAImportar()">Importar Manifest</button>
    <button class="btn-accion btn-preview" (click)="irAVistaPrevia()">Vista previa</button>
  </div>
</div>
