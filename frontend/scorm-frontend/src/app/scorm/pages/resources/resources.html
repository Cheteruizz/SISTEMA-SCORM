<div class="contenedor-recursos">

    <div class="header-nav">
        <button class="btn-volver-atras" (click)="volver()">
            <span class="flecha-azul">&#8617;</span> Volver
        </button>
    </div>

    <div class="contenido-central">
        <!-- Información sobre como subir archivos -->
        <div class="cabecera">
            <h1 class="titulo-principal">Recursos del Curso</h1>

            <p class="descripcion">
                Sube aquí los archivos multimedia y materiales educativos que usarán tus lecciones.
                Puedes añadir tantos recursos como desees.
            </p>
        </div>

        <form [formGroup]="recursosForm" class="formulario-recursos">
            <!-- Campos de subida archivo -->
            <h3 class="subtitulo-archivo">Archivo:</h3>

            <div class="grid-inputs">
                <div class="grupo-input">
                    <label>Nombre del Archivo:</label>
                    <input type="text" formControlName="nombreArchivo" class="input-borde-azul">
                </div>

                <div class="grupo-input">
                    <label>ID del Archivo:</label>
                    <input type="text" formControlName="idArchivo" class="input-borde-azul">
                </div>

                <div class="grupo-input">
                    <label>Tipo de Archivo:</label>
                    <input type="file" formControlName="tipoArchivo" class="input-borde-azul"
                        (change)="onFileSelected($event)"
                        accept=".pdf, .doc, .docx, .jpg, .jpeg, .png, .gif, .mp4, .avi, .zip, .rar, .scorm">
                </div>

                <div class="texto-ayuda-container">
                    <p class="texto-ayuda">
                        Este sistema permite adjuntar cualquier tipo de archivo: PDF, vídeo, imágenes, documentos, ZIP,
                        SCORM y más.
                    </p>
                </div>
            </div>

        </form>
    </div>
    <!-- Botones de acción -->
    <button class="btn-accion btn-preview" (click)="irAVistaPrevia()">
        Vista previa <span class="flecha-dorada">➜</span>
    </button>
</div>
